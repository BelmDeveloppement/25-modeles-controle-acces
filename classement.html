const AC = {};
AC.DEFAULT_RELAY = 'https://ntfy.sh';
AC.LET = ['A', 'B', 'C', 'D'];
AC.LCOL = ['#3B82F6', '#F0E442', '#E8710A', '#D946EF'];   // A à D : couleurs de VLAN 10, 20, 30, 40
AC.VLAN = [10, 20, 30, 40];
AC.BASE = 100; AC.SPEED = 50; AC.STREAK = 10; AC.STREAKMAX = 5;
AC.LATE = 0.5; AC.GRACE = 1500;   // réponse tardive (après le chrono) : moitié des points de base, sans bonus ; tolérance de 1,5 s pour le réseau
AC.esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
AC.sleep = ms => new Promise(r => setTimeout(r, ms));
AC.rid = n => { const a = 'abcdefghjkmnpqrstuvwxyz23456789'; let s = ''; const b = new Uint8Array(n); crypto.getRandomValues(b); b.forEach(x => s += a[x % a.length]); return s; };
AC.hash = () => { const o = {}; location.hash.replace(/^#/, '').split('&').forEach(p => { const i = p.indexOf('='); if (i > 0) o[p.slice(0, i)] = decodeURIComponent(p.slice(i + 1)); }); return o; };
AC.fmtT = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
AC.ms = ms => (ms / 1000).toFixed(1).replace('.', ',') + ' s';
AC.q = id => AC.PUB.qs[id];
AC.num = id => +String(id).slice(1);
AC.norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
AC.CLOUDPT = 50;   // points par mot attendu trouvé (nuage de mots)
AC.grp = id => AC.PUB.groups.find(g => g.id === id);
AC.rankList = pl => Object.keys(pl).map(p => Object.assign({pid:p}, pl[p])).sort((a, b) => (b.pts - a.pts) || (a.tt - b.tt) || a.n.localeCompare(b.n, 'fr'));

/* ---------------- Relais (ntfy) : états diffusés en morceaux ---------------- */
AC.CH = 1500; AC.CHW = 50000;
AC.DEFAULT_WS = 'wss://cpro-relay.belmdeveloppement.workers.dev/ps';   // relais Cloudflare (WebSocket, port 443) ; ntfy reste le repli
AC.Relay = function (base, sid, ws) {
  this.base = (base || AC.DEFAULT_RELAY).replace(/\/+$/, '');
  this.tH = 'ac' + sid + 'h'; this.tP = 'ac' + sid + 'p'; this.tS = 'ac' + sid + 's';
  this.room = sid;
  const h = AC.hash(); this.wsBase = h.ws === '0' ? '' : (h.ws || (ws === undefined ? AC.DEFAULT_WS : ws));
  this._subs = {}; this._acks = {}; this._seen = new Set(); this._ws = null; this._wsUp = false; this._fails = 0; this._dead = false;
};
AC.Relay.prototype.useWs = function (topic) { return !!this.wsBase && (topic === this.tH || topic === this.tP || topic === this.tS); };
AC.Relay.prototype.wsUp = function () { return this._wsUp; };
AC.Relay.prototype._statusAll = function () { Object.keys(this._subs).forEach(t => this._subs[t].upd && this._subs[t].upd()); };
AC.Relay.prototype._wsOpen = function () {
  if (!this.wsBase || this._ws || this._dead) return;
  let w; try { w = new WebSocket(this.wsBase + (this.wsBase.indexOf('?') > 0 ? '&' : '?') + 'room=' + encodeURIComponent(this.room)); }
  catch (e) { this._wsRetry(); return; }
  this._ws = w; let ping = null, closed = false;
  w.onopen = () => {
    this._wsUp = true; this._fails = 0;
    Object.keys(this._subs).forEach(t => { if (this._subs[t].ws) w.send(JSON.stringify({a: 'sub', t, since: this._subs[t].last})); });
    ping = setInterval(() => { try { w.send('ping'); } catch (e) {} }, 25000);
    this._statusAll();
  };
  w.onmessage = e => {
    if (e.data === 'pong') return;
    let m; try { m = JSON.parse(e.data); } catch (x) { return; }
    if (m.a === 'ack') { const k = this._acks[m.u]; if (k) { clearTimeout(k.t); delete this._acks[m.u]; if (m.n === 0 && k.fb) k.fb(); } return; }
    if (m.a !== 'msg') return;
    const s = this._subs[m.t]; if (!s) return;
    s.last = m.id;
    let o; try { o = JSON.parse(m.m); } catch (x) { return; }
    s.cb(o, m.t === this.tS && m.ts ? {time: m.ts / 1000, ws: true} : undefined);   // sujet diapos : horodatage serveur (pour ignorer les diapos d'avant l'ouverture)
  };
  const end = () => {
    if (closed) return; closed = true; clearInterval(ping);
    this._ws = null; this._wsUp = false; this._fails++; this._statusAll(); this._wsRetry();
  };

AC.Relay.prototype._wsRetry = function () { if (this._dead) return; setTimeout(() => this._wsOpen(), Math.min(15000, 1000 * Math.pow(2, Math.min(this._fails, 4)))); };
AC.Relay.prototype._wsSend = function (o) { try { this._ws.send(JSON.stringify(o)); return true; } catch (e) { return false; } };
AC.Relay.prototype._ntfy = async function (topic, body) {
  for (let i = 0; i < 5; i++) {
    try { const r = await fetch(this.base + '/' + topic, {method: 'POST', body}); if (r.ok) return true; if (r.status === 429) await AC.sleep(4000); }
    catch (e) { /* réseau */ }
    await AC.sleep(500 * (i + 1));
  }
  return false;
};
/* post : par WebSocket si disponible (avec repli sur ntfy si personne n'écoute ou pas d'accusé), sinon par ntfy */
AC.Relay.prototype.post = async function (topic, obj) {
  obj = Object.assign({_u: AC.rid(10)}, obj);
  const body = JSON.stringify(obj);
  if (this.useWs(topic) && this._wsUp) {
    const fb = () => this._ntfy(topic, body);
    const t = setTimeout(() => { delete this._acks[obj._u]; fb(); }, 2500);
    this._acks[obj._u] = {t, fb};
    if (this._wsSend({a: 'pub', t: topic, m: body, u: obj._u})) return true;
    clearTimeout(t); delete this._acks[obj._u];
  }
  return this._ntfy(topic, body);
};
AC.Relay.prototype.sub = function (topic, since, onmsg, onstatus) {
  let last = since, es = null, dead = false, esOk = false;
  const seen = this._seen;
  const deliver = (o, m) => {
    if (o && o._u) { if (seen.has(o._u)) return; seen.add(o._u); if (seen.size > 20000) seen.clear(); }
    onmsg(o, m);
  };
  const upd = () => onstatus && onstatus(esOk || this._wsUp ? 'ok' : 'retry');

    if (dead) return;
    es = new EventSource(this.base + '/' + topic + '/sse?since=' + encodeURIComponent(last));

      if (m.event && m.event !== 'message') return;
      if (m.id) last = m.id;
      let o; try { o = JSON.parse(m.message); } catch (x) { return; }
      deliver(o, m);
    };
  };
  open();
  if (this.useWs(topic)) {
    this._subs[topic] = {last: 0, cb: (o, mm) => deliver(o, mm), ws: true, upd};
    if (this._wsUp) this._wsSend({a: 'sub', t: topic, since: 0}); else this._wsOpen();

  return () => { dead = true; try { es.close(); } catch (e) {} delete this._subs[topic]; };
};
AC.Relay.prototype.pubState = function (st) {
  const s = JSON.stringify(st), n = Math.ceil(s.length / AC.CH);
  const ntfyGo = () => {               // copie sur ntfy (repli) : seulement si le relais ne suffit pas, pour ménager le quota de ntfy.sh
    this._pending = {v: st.v, s, n};
    if (this._busy) return;
    this._busy = true;
    (async () => {
      while (this._pending) {
        const p = this._pending; this._pending = null;
        let ok = true;
        for (let i = 0; i < p.n && ok; i++) ok = await this._ntfy(this.tH, JSON.stringify({_u: AC.rid(10), v: p.v, i, n: p.n, d: p.s.slice(i * AC.CH, (i + 1) * AC.CH)}));
        this.lastOk = ok;
      }
      this._busy = false;
    })();
  };
  if (this.wsBase && this._wsUp) {     // WebSocket : état complet en un ou quelques gros messages, immédiat
    const k = Math.ceil(s.length / AC.CHW);
    let sent = true;
    for (let i = 0; i < k; i++) {
      const u = AC.rid(10);
      if (i === 0) {                   // accusé du relais : si aucun abonné (n=0) ou pas de réponse en 2,5 s, on recopie sur ntfy
        const t = setTimeout(() => { delete this._acks[u]; ntfyGo(); }, 2500);
        this._acks[u] = {t, fb: ntfyGo};
      }
      if (!this._wsSend({a: 'pub', t: this.tH, m: JSON.stringify({_u: AC.rid(10), v: st.v, i, n: k, d: s.slice(i * AC.CHW, (i + 1) * AC.CHW)}), u: i === 0 ? u : undefined})) sent = false;
    }
    if (sent && AC.hash().ntfy !== '1') return;     // ajouter « &ntfy=1 » au lien de la tour pour toujours doubler sur ntfy
  }

AC.Assembler = function (cb) {

  return o => {
    if (o == null || o.v == null || o.v < cur) return;
    const key = o.v + '/' + o.n, p = parts[key] || (parts[key] = {n: o.n, a: []});
    p.a[o.i] = o.d;
    let ok = true; for (let i = 0; i < p.n; i++) if (p.a[i] == null) ok = false;
    if (ok && o.v > cur) {
      cur = o.v;
      try { cb(JSON.parse(p.a.join(''))); } catch (e) { console.error(e); }
      Object.keys(parts).forEach(k => { if (parseInt(k, 10) < cur) delete parts[k]; });
    }
  };
};

fidentiel","Permis, et cela ne pose aucun problème","Refusé par NWD, écriture vers le bas"],"t":60,"rap":"Omar, habilité Interne, ajoute une ligne dans le journal des incidents classé Confidentiel. Que dit BLP, et que faut-il en penser ?\n\nA. Permis par BLP, mais cela pose un problème d’intégrité\nB. Refusé par BLP : un Interne ne touche pas au Confidentiel\nC. Permis, et cela ne pose aucun problème\nD. Refusé par NWD, écriture vers le bas"},"Q06":{"g":"G06","ctx":null,"final":false,"sl":27,"ap":28,"type":"single","txt":"En pleine session, Inès (Confidentiel) demande au système de passer son propre niveau à Secret pour ouvrir un document. Quelle propriété de BLP s’y oppose ?","opts":["La propriété étoile : un sujet ne peut pas écrire vers un niveau inférieur à son niveau actuel","La propriété de sécurité simple : pas de lecture vers un niveau supérieur au sien","La séparation des tâches : une même personne ne peut pas à la fois demander et approuver","La tranquillité : les niveaux des sujets et des objets sont fixés et ne changent pas en cours de session"],"t":60,"rap":"En pleine session, Inès (Confidentiel) demande au système de passer son propre niveau à Secret pour ouvrir un document. Quelle propriété de BLP s’y oppose ?\n\nA. La propriété étoile : un sujet ne peut pas écrire vers un niveau inférieur à son niveau actuel\nB. La propriété de sécurité simple : pas de lecture vers un niveau supérieur au sien\nC. La séparation des tâches : une même personne ne peut pas à la fois demander et approuver\nD. La tranquillité : les niveaux des sujets et des objets sont fixés et ne changent pas en cours de session"},"Q07":{"g":"G07","ctx":null,"final":false,"sl":29,"ap":30,"type":"multi","txt":"Niveaux : Public (0) < Interne (1) < Confidentiel (2) < Secret (3). Léa (conductrice) : Interne. Marc (gestionnaire) : Confidentiel. La directrice : Secret. Objets : plaquette (Public), planning des tournées (Interne), contrats clients (Confidentiel), plan stratégique (Secret).","items":[{"t":"Léa lit le planning des tournées.","o":["REFUSÉ, règle NRU (lecture vers le haut)","REFUSÉ, règle NWD (écriture vers le bas)","REFUSÉ, aucune règle BLP mais le propriétaire doit valider","PERMIS"]},{"t":"Léa lit les contrats clients.","o":["PERMIS","REFUSÉ, règle NWD (écriture vers le bas)","REFUSÉ, règle NRU (lecture vers le haut)","PERMIS, car Léa est salariée"]},{"t":"Marc lit le planning des tournées.","o":["REFUSÉ, règle NRU (lecture vers le haut)","REFUSÉ, règle NWD (écriture vers le bas)","REFUSÉ, il doit d’abord demander au propriétaire","PERMIS"]},{"t":"Marc écrit dans le planning des tournées.","o":["PERMIS","REFUSÉ, règle NWD (écriture vers le bas)","REFUSÉ, règle NRU (lecture vers le haut)","PERMIS, car il est gestionnaire"]},{"t":"Léa écrit un compte rendu dans le plan stratégique.","o":["REFUSÉ, règle NRU (lecture vers le haut)","REFUSÉ, règle NWD (écriture vers le bas)","REFUSÉ, car le plan est Secret","PERMIS"]},{"t":"La directrice écrit dans la plaquette commerciale.","o":["REFUSÉ, règle NWD (écriture vers le bas)","PERMIS","REFUSÉ, règle NRU (lecture vers le haut)","PERMIS, car elle est au plus haut niveau"]}],"opts":[],"t":240,"rap":"Niveaux : Public (0) < Interne (1) < Confidentiel (2) < Secret (3). Léa (conductrice) : Interne. Marc (gestionnaire) : Confidentiel. La directrice : Secret. Objets : plaquette (Public), planning des tournées (Interne), contrats clients (Confidentiel), plan stratégique (Secret).\n\n1. Léa lit le planning des tournées.\n2. Léa lit les contrats clients.\n3. Marc lit le planning des tournées.\n4. Marc écrit dans le planning des tournées.\n5. Léa écrit un compte rendu dans le plan stratégique.\n6. La directrice écrit dans la plaquette commerciale."},"Q08":{"g":"G08","ctx":null,"final":false,"sl":36,"ap":37,"type":"single","txt":"Le logiciel de paie (intégrité haute) veut importer un fichier de pointage reçu d’un téléphone personnel (intégrité basse). Que décide Biba ?","opts":["Permis : la paie a le niveau le plus haut","Refusé : no write up","Refusé : no read down","Permis si le fichier est classé Confidentiel"],"t":60,"rap":"Le logiciel de paie (intégrité haute) veut importer un fichier de pointage reçu d’un téléphone personnel (intégrité basse). Que décide Biba ?\n\nA. Permis : la paie a le niveau le plus haut\nB. Refusé : no write up\nC. Refusé : no read down\nD. Permis si le fichier est classé Confidentiel"},"Q09":{"g":"G09","ctx":null,"final":false,"sl":39,"ap":40,"type":"single","txt":"Un stagiaire (intégrité basse) veut corriger lui-même une ligne du grand livre (intégrité haute). Que décide Biba ?","opts":["Permis : corriger une erreur améliore l’intégrité","Refusé : no write up","Refusé : no read down","Permis avec la validation de son tuteur"],"t":60,"rap":"Un stagiaire (intégrité basse) veut corriger lui-même une ligne du grand livre (intégrité haute). Que décide Biba ?\n\nA. Permis : corriger une erreur améliore l’intégrité\nB. Refusé : no write up\nC. Refusé : no read down\nD. Permis avec la validation de son tuteur"},"Q10":{"g":"G10","ctx":null,"final":false,"sl":46,"ap":47,"type":"single","txt":"Dans Clark-Wilson, quel élément vérifie que les données contraintes restent cohérentes (par exemple, que la somme des factures égale le total comptable) ?","opts":["Le TP, procédure de transformation qui modifie les CDI de façon bien formée","L’UDI, donnée non contrainte que le système reçoit de l’extérieur et doit valider","Le journal d’audit, qui garde la trace de chaque transformation exécutée","L’IVP, la procédure de vérification d’intégrité qui contrôle la cohérence des CDI après coup"],"t":60,"rap":"Dans Clark-Wilson, quel élément vérifie que les données contraintes restent cohérentes (par exemple, que la somme des factures égale le total comptable) ?\n\nA. Le TP, procédure de transformation qui modifie les CDI de façon bien formée\nB. L’UDI, donnée non contrainte que le système reçoit de l’extérieur et doit valider\nC. Le journal d’audit, qui garde la trace de chaque transformation exécutée\nD. L’IVP, la procédure de vérification d’intégrité qui contrôle la cohérence des CDI après coup"},"Q11":{"g":"G11","ctx":null,"final":false,"sl":48,"ap":49,"type":"single","txt":"Pourquoi Clark-Wilson autorise-t-il un triplet (utilisateur, TP, CDI) plutôt qu’un simple droit « écrire » sur un fichier ?","opts":["Parce que l’utilisateur ne peut modifier la donnée qu’à travers une procédure certifiée, jamais en écrivant directement dans le fichier","Pour pouvoir attribuer le droit d’écriture à chaque donnée séparément, comme le fait un propriétaire en DAC","Pour classer les données selon leur niveau de confidentialité avant toute modification","Parce que cela accélère les accès aux données en évitant les contrôles répétés"],"t":60,"rap":"Pourquoi Clark-Wilson autorise-t-il un triplet (utilisateur, TP, CDI) plutôt qu’un simple droit « écrire » sur un fichier ?\n\nA. Parce que l’utilisateur ne peut modifier la donnée qu’à travers une procédure certifiée, jamais en écrivant directement dans le fichier\nB. Pour pouvoir attribuer le droit d’écriture à chaque donnée séparément, comme le fait un propriétaire en DAC\nC. Pour classer les données selon leur niveau de confidentialité avant toute modification\nD. Parce que cela accélère les accès aux données en évitant les contrôles répétés"},"Q12":{"g":"G12","ctx":null,"final":false,"sl":51,"ap":52,"type":"multi","txt":"Niveaux d’intégrité : Haute (grand livre comptable validé), Moyenne (saisies des gestionnaires), Basse (relevés des tablettes, fichiers téléchargés). Sonia : Haute. Marc : Moyenne. Un conducteur : Basse.","items":[{"t":"Sonia (Haute) lit les relevés des tablettes (Basse).","o":["PERMIS","REFUSÉ, no read down","REFUSÉ, no write up","REFUSÉ, niveau de confidentialité insuffisant"]},{"t":"Marc (Moyenne) écrit dans le grand livre (Haute).","o":["PERMIS","REFUSÉ, no read down","REFUSÉ, no write up","PERMIS, car Marc est gestionnaire"]},{"t":"Sonia (Haute) lit le grand livre (Haute).","o":["REFUSÉ, no read down","PERMIS","REFUSÉ, no write up","REFUSÉ, sauf accord du propriétaire"]},{"t":"Un conducteur (Basse) lit le grand livre (Haute).","o":["PERMIS","REFUSÉ, no read down","REFUSÉ, no write up","REFUSÉ, car le grand livre est confidentiel"]},{"t":"Marc (Moyenne) lit un fichier téléchargé sur le Web (Basse).","o":["PERMIS","REFUSÉ, no write up","REFUSÉ, no read down","PERMIS après un antivirus"]},{"t":"Un conducteur (Basse) écrit dans les saisies des gestionnaires (Moyenne).","o":["REFUSÉ, no write up","PERMIS","REFUSÉ, no read down","PERMIS, car il est salarié"]}],"opts":[],"t":240,"rap":"Niveaux d’intégrité : Haute (grand livre comptable validé), Moyenne (saisies des gestionnaires), Basse (relevés des tablettes, fichiers téléchargés). Sonia : Haute. Marc : Moyenne. Un conducteur : Basse.\n\n1. Sonia (Haute) lit les relevés des tablettes (Basse).\n2. Marc (Moyenne) écrit dans le grand livre (Haute).\n3. Sonia (Haute) lit le grand livre (Haute).\n4. Un conducteur (Basse) lit le grand livre (Haute).\n5. Marc (Moyenne) lit un fichier téléchargé sur le Web (Basse).\n6. Un conducteur (Basse) écrit dans les saisies des gestionnaires (Moyenne)."},"Q13":{"g":"G13","ctx":null,"final":false,"sl":53,"ap":54,"type":"multi","txt":"Le TMS de TransLor contient la table « Factures » (CDI). Les saisies brutes des tablettes sont des UDI. Procédures certifiées : TP1 « enregistrer une livraison », TP2 « émettre une facture », TP3 « corriger un tarif ». IVP : « total des factures = total comptable ». Droits : Léa peut lancer TP1 ; Sonia TP2 ; Marc TP1 et TP3.","items":[{"t":"Combien de triplets (utilisateur, TP, CDI) sont autorisés par les droits décrits ?","o":["4","3","6","9"]},{"t":"Léa modifie directement la table Factures avec un outil de base de données : autorisé ou refusé ?","o":["AUTORISÉ : Léa est une utilisatrice déclarée du TMS et peut ouvrir la table","REFUSÉ : aucun triplet ne l’autorise, une modification directe contourne les TP","AUTORISÉ, à condition que l’IVP soit exécuté le soir même par un administrateur","REFUSÉ : Léa n’est pas propriétaire de la table"]},{"t":"Marc lance TP2 « émettre une facture » : autorisé ou refusé ?","o":["AUTORISÉ : Marc est gestionnaire et dispose déjà de TP1 et TP3","AUTORISÉ : TP2 est une procédure certifiée donc sûre pour tous","REFUSÉ : le triplet (Marc, TP2, Factures) n’existe pas","REFUSÉ : TP2 est réservée aux administrateurs du TMS"]},{"t":"À quoi sert l’IVP en fin de journée ?","o":["À recalculer le total des factures et alerter si l’écart avec le total comptable n’est pas nul","À sauvegarder la table Factures et à vérifier que la copie est complète sur le serveur","À contrôler le mot de passe de chaque utilisateur et à désactiver les comptes inactifs","À supprimer les saisies de tablettes déjà traitées pour libérer de la place"]}],"opts":[],"t":180,"rap":"Le TMS de TransLor contient la table « Factures » (CDI). Les saisies brutes des tablettes sont des UDI. Procédures certifiées : TP1 « enregistrer une livraison », TP2 « émettre une facture », TP3 « corriger un tarif ». IVP : « total des factures = total comptable ». Droits : Léa peut lancer TP1 ; Sonia TP2 ; Marc TP1 et TP3.\n\n1. Combien de triplets (utilisateur, TP, CDI) sont autorisés par les droits décrits ?\n2. Léa modifie directement la table Factures avec un outil de base de données : autorisé ou refusé ?\n3. Marc lance TP2 « émettre une facture » : autorisé ou refusé ?\n4. À quoi sert l’IVP en fin de journée ?"},"Q14":{"g":"G14","ctx":null,"final":false,"sl":59,"ap":60,"type":"single","txt":"Dans un modèle DAC, qui décide des droits d’accès à un dossier ?","opts":["Une autorité de sécurité centrale, quel que soit le propriétaire","Son propriétaire","Le rôle de la personne dans l’annuaire","L’heure et l’appareil de la personne"],"t":60,"rap":"Dans un modèle DAC, qui décide des droits d’accès à un dossier ?\n\nA. Une autorité de sécurité centrale, quel que soit le propriétaire\nB. Son propriétaire\nC. Le rôle de la personne dans l’annuaire\nD. L’heure et l’appareil de la personne"},"Q15":{"g":"G15","ctx":null,"final":false,"sl":61,"ap":62,"type":"single","txt":"Dans une autre PME, 10 responsables ont chacun créé 5 dossiers et ajouté en moyenne 2 personnes à chacun, sans validation. Combien d’autorisations n’ont jamais été validées ?","opts":["50 autorisations","17 autorisations","100 autorisations","20 autorisations"],"t":60,"rap":"Dans une autre PME, 10 responsables ont chacun créé 5 dossiers et ajouté en moyenne 2 personnes à chacun, sans validation. Combien d’autorisations n’ont jamais été validées ?\n\nA. 50 autorisations\nB. 17 autorisations\nC. 100 autorisations\nD. 20 autorisations"},"Q16":{"g":"G16","ctx":null,"final":false,"sl":64,"ap":65,"type":"multi","txt":"Le partage « Exploitation » de TransLor contient le planning des tournées et les procédures. Chacun des 15 gestionnaires peut modifier librement les ACL des dossiers qu’il crée. En moyenne, un gestionnaire a créé 8 dossiers et y a ajouté 3 personnes.","items":[{"t":"Quel est le risque principal quand chaque gestionnaire modifie librement les ACL ?","o":["Le serveur sature","Les noms de fichiers deviennent trop longs","Les sauvegardes échouent","Les droits s’accumulent sans que personne ne les valide"]},{"t":"Quel contrôle est applicable dès demain par deux informaticiens ?","o":["Interdire tout partage de dossier jusqu’à la prochaine revue des droits","Journaliser les changements d’ACL et alerter sur les comptes externes","Racheter un serveur de fichiers plus récent avec gestion centralisée","Former chaque gestionnaire pendant un an avant de rouvrir les partages"]},{"t":"Combien d’autorisations ont été créées sans aucune validation ? (15 gestionnaires, 8 dossiers chacun, 3 personnes par dossier)","o":["120","360","26","45"]},{"t":"Quel contrôle mettez-vous en place en premier ?","o":["La revue trimestrielle des droits, menée seule par la direction","Le ticket obligatoire pour chaque modification, à lui seul","La suppression de toutes les ACL existantes pour repartir de zéro","Le journal et l’alerte, rapides et sans gêne"]}],"opts":[],"t":180,"rap":"Le partage « Exploitation » de TransLor contient le planning des tournées et les procédures. Chacun des 15 gestionnaires peut modifier librement les ACL des dossiers qu’il crée. En moyenne, un gestionnaire a créé 8 dossiers et y a ajouté 3 personnes.\n\n1. Quel est le risque principal quand chaque gestionnaire modifie librement les ACL ?\n2. Quel contrôle est applicable dès demain par deux informaticiens ?\n3. Combien d’autorisations ont été créées sans aucune validation ? (15 gestionnaires, 8 dossiers chacun, 3 personnes par dossier)\n4. Quel contrôle mettez-vous en place en premier ?"},"Q17":{"g":"G17","ctx":null,"final":false,"sl":66,"ap":67,"type":"single","txt":"Dans une entreprise soumise à des obligations réglementaires, que recommande-t-on pour renforcer un partage de fichiers en DAC ?","opts":["Remplacer les ACL par un partage unique ouvert à tous les salariés, pour simplifier l’audit","Autoriser chaque propriétaire à transférer librement ses droits, pour garder la souplesse du DAC","Réduire la durée de conservation des journaux pour alléger la charge du serveur","Ajouter des rôles ou un contrôle obligatoire, avec des revues d’accès régulières"],"t":60,"rap":"Dans une entreprise soumise à des obligations réglementaires, que recommande-t-on pour renforcer un partage de fichiers en DAC ?\n\nA. Remplacer les ACL par un partage unique ouvert à tous les salariés, pour simplifier l’audit\nB. Autoriser chaque propriétaire à transférer librement ses droits, pour garder la souplesse du DAC\nC. Réduire la durée de conservation des journaux pour alléger la charge du serveur\nD. Ajouter des rôles ou un contrôle obligatoire, avec des revues d’accès régulières"},"Q18":{"g":"G18","ctx":null,"final":false,"sl":72,"ap":73,"type":"single","txt":"Dans RBAC, comment accorder une nouvelle permission aux 35 agents du rôle « Magasinier » ?","opts":["Ajouter la permission directement sur chacun des 35 comptes, un par un","Modifier le rôle une seule fois : la permission se répercute sur les 35 comptes","Modifier l’ACL de chaque fichier concerné pour y inscrire les 35 agents","Créer pour chaque agent un rôle personnel qui porte la nouvelle permission"],"t":60,"rap":"Dans RBAC, comment accorder une nouvelle permission aux 35 agents du rôle « Magasinier » ?\n\nA. Ajouter la permission directement sur chacun des 35 comptes, un par un\nB. Modifier le rôle une seule fois : la permission se répercute sur les 35 comptes\nC. Modifier l’ACL de chaque fichier concerné pour y inscrire les 35 agents\nD. Créer pour chaque agent un rôle personnel qui porte la nouvelle permission"},"Q19":{"g":"G19","ctx":null,"final":false,"sl":76,"ap":77,"type":"single","txt":"Dans une agence, personne ne peut à la fois créer un bon de commande et le valider. Quel principe cette règle applique-t-elle ?","opts":["La séparation des tâches (SoD) : initier et approuver sont confiés à deux personnes différentes","Le moindre privilège : chacun n’a que les droits nécessaires à sa mission","Le Just-in-Time : les droits ne sont accordés que pour une durée limitée","La défense en profondeur : plusieurs contrôles se superposent sur la même ressource"],"t":60,"rap":"Dans une agence, personne ne peut à la fois créer un bon de commande et le valider. Quel principe cette règle applique-t-elle ?\n\nA. La séparation des tâches (SoD) : initier et approuver sont confiés à deux personnes différentes\nB. Le moindre privilège : chacun n’a que les droits nécessaires à sa mission\nC. Le Just-in-Time : les droits ne sont accordés que pour une durée limitée\nD. La défense en profondeur : plusieurs contrôles se superposent sur la même ressource"},"Q20":{"g":"G20","ctx":null,"final":false,"sl":78,"ap":79,"type":"multi","txt":"Le TMS de TransLor compte 120 utilisateurs et 4 rôles : Conducteur, Gestionnaire, Comptable, Responsable d’exploitation. Permissions : consulter une tournée ; créer une tournée ; modifier une tournée ; saisir une livraison ; valider la clôture d’une tournée ; émettre une facture ; modifier un tarif ; extraire les rapports d’exploitation.","items":[{"t":"Combien de croix compte la matrice rôles × permissions attendue (moindre privilège), sur 32 cases ?","o":["14","8","20","32"]},{"t":"Sans rôles, combien de cases à gérer (120 utilisateurs × 8 permissions) ?","o":["128","480","152","960"]},{"t":"Avec rôles, combien d’éléments (4 × 8 cases + 120 affectations) ?","o":["960","128","152","32"]},{"t":"Léa passe conductrice → gestionnaire : combien d’opérations avec rôles ?","o":["8 : une par permission","4 : une par rôle","1 : changer son affectation de rôle","960 : tout recalculer"]}],"opts":[],"t":180,"rap":"Le TMS de TransLor compte 120 utilisateurs et 4 rôles : Conducteur, Gestionnaire, Comptable, Responsable d’exploitation. Permissions : consulter une tournée ; créer une tournée ; modifier une tournée ; saisir une livraison ; valider la clôture d’une tournée ; émettre une facture ; modifier un tarif ; extraire les rapports d’exploitation.\n\n1. Combien de croix compte la matrice rôles × permissions attendue (moindre privilège), sur 32 cases ?\n2. Sans rôles, combien de cases à gérer (120 utilisateurs × 8 permissions) ?\n3. Avec rôles, combien d’éléments (4 × 8 cases + 120 affectations) ?\n4. Léa passe conductrice → gestionnaire : combien d’opérations avec rôles ?"},"Q21":{"g":"G21","ctx":null,"final":false,"sl":80,"ap":81,"type":"multi","txt":"Chez TransLor, Sonia (comptable) peut créer un fournisseur, modifier son RIB et valider le paiement. Un faux courriel demande un changement de RIB : 18 400 € sont virés vers un compte frauduleux. La marge annuelle est d’environ 280 k€.","items":[{"t":"Quel principe la situation (Sonia crée le fournisseur, change le RIB et valide le paiement) viole-t-elle ?","o":["La séparation des tâches","Le moindre privilège seul","La disponibilité","La non-répudiation"]},{"t":"Quelle règle de séparation des tâches est la plus précise ?","o":["Les comptables doivent rester prudents et vérifier chaque courriel avant de payer","Les rôles « Gestion des fournisseurs » et « Validation des paiements » sont incompatibles pour une même personne","Sonia doit refuser systématiquement les faux courriels qu’elle reçoit","Tout paiement supérieur à 10 000 € doit être signalé à la direction après coup"]},{"t":"Quel contrôle compensatoire convient à une petite équipe (2 informaticiens, pas de RSSI) ?","o":["Un antivirus plus récent installé sur tous les postes de la comptabilité","Un mot de passe plus long, renouvelé tous les mois, pour le compte de Sonia","Un rappel téléphonique au numéro connu du fournisseur avant tout paiement vers un RIB modifié","Un pare-feu supplémentaire à l’entrée du réseau de l’entreprise"]},{"t":"Quel poids représente la fraude (18 400 €) dans la marge annuelle de 280 000 € ?","o":["Environ 66 %","Environ 6,6 %","Environ 0,66 %","Environ 15 %"]}],"opts":[],"t":180,"rap":"Chez TransLor, Sonia (comptable) peut créer un fournisseur, modifier son RIB et valider le paiement. Un faux courriel demande un changement de RIB : 18 400 € sont virés vers un compte frauduleux. La marge annuelle est d’environ 280 k€.\n\n1. Quel principe la situation (Sonia crée le fournisseur, change le RIB et valide le paiement) viole-t-elle ?\n2. Quelle règle de séparation des tâches est la plus précise ?\n3. Quel contrôle compensatoire convient à une petite équipe (2 informaticiens, pas de RSSI) ?\n4. Quel poids représente la fraude (18 400 €) dans la marge annuelle de 280 000 € ?"},"Q22":{"g":"G22","ctx":null,"final":false,"sl":82,"ap":83,"type":"multi","txt":"TransLor ouvre trois agences : Nancy, Metz et Épinal. Hiérarchie : Responsable d’exploitation ⊃ Gestionnaire ⊃ Conducteur (un rôle hérite de celui du dessous). Permissions propres : Conducteur : consulter une tournée, saisir une livraison. Gestionnaire : créer et modifier une tournée. Responsable : valider la clôture, extraire les rapports.","items":[{"t":"Combien de permissions effectives pour le Responsable d’exploitation (propres + héritées) ?","o":["2","4","8","6"]},{"t":"Combien de liens permission → rôle sans hiérarchie (tout recopié) ?","o":["6","8","12","4"]},{"t":"Combien de liens avec hiérarchie (propres + liens d’héritage) ?","o":["12","8","6","10"]},{"t":"Un rôle par fonction et par agence (3 fonctions × 3 agences), puis « jour » et « nuit » : combien de rôles ?","o":["9","6","12","18"]},{"t":"Que proposez-vous pour éviter cette explosion ?","o":["Un rôle par personne, pour affiner les droits de chacun","Supprimer la hiérarchie des rôles, qui complique la lecture des droits","Un rôle par agence, avec une variante jour et une variante nuit","3 rôles de base ; l’agence et l’horaire portés par des attributs"]}],"opts":[],"t":210,"rap":"TransLor ouvre trois agences : Nancy, Metz et Épinal. Hiérarchie : Responsable d’exploitation ⊃ Gestionnaire ⊃ Conducteur (un rôle hérite de celui du dessous). Permissions propres : Conducteur : consulter une tournée, saisir une livraison. Gestionnaire : créer et modifier une tournée. Responsable : valider la clôture, extraire les rapports.\n\n1. Combien de permissions effectives pour le Responsable d’exploitation (propres + héritées) ?\n2. Combien de liens permission → rôle sans hiérarchie (tout recopié) ?\n3. Combien de liens avec hiérarchie (propres + liens d’héritage) ?\n4. Un rôle par fonction et par agence (3 fonctions × 3 agences), puis « jour » et « nuit » : combien de rôles ?\n5. Que proposez-vous pour éviter cette explosion ?"},"Q23":{"g":"G23","ctx":null,"final":false,"sl":86,"ap":87,"type":"single","txt":"Dans une hiérarchie de rôles, le rôle « Responsable » hérite du rôle « Gestionnaire ». Une nouvelle permission est ajoutée au rôle « Gestionnaire ». Que se passe-t-il ?","opts":["Seuls les gestionnaires la reçoivent","Seuls les responsables la reçoivent","Les gestionnaires et les responsables la reçoivent","Personne, il faut la ressaisir pour chaque utilisateur"],"t":60,"rap":"Dans une hiérarchie de rôles, le rôle « Responsable » hérite du rôle « Gestionnaire ». Une nouvelle permission est ajoutée au rôle « Gestionnaire ». Que se passe-t-il ?\n\nA. Seuls les gestionnaires la reçoivent\nB. Seuls les responsables la reçoivent\nC. Les gestionnaires et les responsables la reçoivent\nD. Personne, il faut la ressaisir pour chaque utilisateur"},"Q24":{"g":"G24","ctx":null,"final":false,"sl":88,"ap":89,"type":"single","txt":"Une très petite entreprise de 6 personnes n’a qu’un seul comptable pour émettre et valider les paiements. Que faire quand la séparation des tâches est impossible ?","opts":["Donner un second compte au comptable pour qu’il émette depuis l’un et valide depuis l’autre","Faire confiance à la personne la plus ancienne dans l’entreprise et s’en tenir là","Désactiver la validation pour les petits montants afin de ne pas ralentir le travail","Ajouter un contrôle indépendant, comme une revue mensuelle des paiements par le dirigeant"],"t":60,"rap":"Une très petite entreprise de 6 personnes n’a qu’un seul comptable pour émettre et valider les paiements. Que faire quand la séparation des tâches est impossible ?\n\nA. Donner un second compte au comptable pour qu’il émette depuis l’un et valide depuis l’autre\nB. Faire confiance à la personne la plus ancienne dans l’entreprise et s’en tenir là\nC. Désactiver la validation pour les petits montants afin de ne pas ralentir le travail\nD. Ajouter un contrôle indépendant, comme une revue mensuelle des paiements par le dirigeant"},"Q25":{"g":"G25","ctx":null,"final":false,"sl":93,"ap":94,"type":"single","txt":"Nadia est propriétaire d’un fichier Confidentiel dans un système à contrôle obligatoire. Peut-elle le rendre Public pour le partager ?","opts":["Oui : le propriétaire d’un fichier décide toujours de qui peut le consulter","Non : seul l’administrateur de sécurité change les étiquettes","Oui, si elle a le même niveau que le fichier, car elle le connaît déjà","Oui, si elle obtient l’accord écrit de son responsable hiérarchique"],"t":60,"rap":"Nadia est propriétaire d’un fichier Confidentiel dans un système à contrôle obligatoire. Peut-elle le rendre Public pour le partager ?\n\nA. Oui : le propriétaire d’un fichier décide toujours de qui peut le consulter\nB. Non : seul l’administrateur de sécurité change les étiquettes\nC. Oui, si elle a le même niveau que le fichier, car elle le connaît déjà\nD. Oui, si elle obtient l’accord écrit de son responsable hiérarchique"},"Q26":{"g":"G26","ctx":null,"final":false,"sl":95,"ap":96,"type":"single","txt":"Omar est habilité (Confidentiel, {Logistique}). Il veut lire un objet (Interne, {Logistique, Douane}). Que décide le système ?","opts":["Permis : son niveau est supérieur à celui de l’objet","Refusé : son niveau est insuffisant","Refusé : le compartiment Douane lui manque","Permis si le propriétaire de l’objet est d’accord"],"t":60,"rap":"Omar est habilité (Confidentiel, {Logistique}). Il veut lire un objet (Interne, {Logistique, Douane}). Que décide le système ?\n\nA. Permis : son niveau est supérieur à celui de l’objet\nB. Refusé : son niveau est insuffisant\nC. Refusé : le compartiment Douane lui manque\nD. Permis si le propriétaire de l’objet est d’accord"},"Q27":{"g":"G27","ctx":null,"final":false,"sl":99,"ap":100,"type":"single","txt":"Le service web d’un serveur Linux protégé par SELinux est piraté. Quel est l’apport principal du contrôle obligatoire ?","opts":["Le processus piraté reste confiné à son domaine","L’attaque est impossible","Le mot de passe de l’administrateur est changé automatiquement","Tous les fichiers sont chiffrés"],"t":60,"rap":"Le service web d’un serveur Linux protégé par SELinux est piraté. Quel est l’apport principal du contrôle obligatoire ?\n\nA. Le processus piraté reste confiné à son domaine\nB. L’attaque est impossible\nC. Le mot de passe de l’administrateur est changé automatiquement\nD. Tous les fichiers sont chiffrés"},"Q28":{"g":"G28","ctx":null,"final":false,"sl":101,"ap":102,"type":"multi","txt":"Sujets : Marc (Confidentiel, {Exploitation}) ; Sonia (Confidentiel, {Finance}) ; Léa (Interne, {Exploitation}) ; la directrice (Secret, {RH, Finance, Exploitation}). Objets : Planning tournées (Interne, {Exploitation}) ; Tarifs clients (Confidentiel, {Exploitation}) ; Bilan (Confidentiel, {Finance}) ; Procédures chauffeurs (Public, {}).","items":[{"t":"Marc (Confidentiel, {Exploitation}) lit Planning tournées (Interne, {Exploitation}).","o":["PERMIS","REFUSÉ : niveau insuffisant","REFUSÉ : compartiment manquant","REFUSÉ : niveau et compartiment insuffisants"]},{"t":"Léa (Interne, {Exploitation}) lit Tarifs clients (Confidentiel, {Exploitation}).","o":["REFUSÉ : niveau insuffisant","PERMIS","REFUSÉ : compartiment manquant","REFUSÉ : niveau et compartiment insuffisants"]},{"t":"Sonia (Confidentiel, {Finance}) lit Bilan (Confidentiel, {Finance}).","o":["REFUSÉ : niveau insuffisant","REFUSÉ : compartiment manquant","PERMIS","REFUSÉ : niveau et compartiment insuffisants"]},{"t":"Marc (Confidentiel, {Exploitation}) lit Bilan (Confidentiel, {Finance}).","o":["REFUSÉ : compartiment manquant","PERMIS","REFUSÉ : niveau insuffisant","REFUSÉ : niveau et compartiment insuffisants"]},{"t":"La directrice (Secret, {RH, Finance, Exploitation}) lit Tarifs clients (Confidentiel, {Exploitation}).","o":["PERMIS","REFUSÉ : niveau insuffisant","REFUSÉ : compartiment manquant","REFUSÉ : niveau et compartiment insuffisants"]},{"t":"Léa (Interne, {Exploitation}) lit Procédures chauffeurs (Public, {}).","o":["REFUSÉ : niveau insuffisant","PERMIS","REFUSÉ : compartiment manquant","REFUSÉ : niveau et compartiment insuffisants"]}],"opts":[],"t":240,"rap":"Sujets : Marc (Confidentiel, {Exploitation}) ; Sonia (Confidentiel, {Finance}) ; Léa (Interne, {Exploitation}) ; la directrice (Secret, {RH, Finance, Exploitation}). Objets : Planning tournées (Interne, {Exploitation}) ; Tarifs clients (Confidentiel, {Exploitation}) ; Bilan (Confidentiel, {Finance}) ; Procédures chauffeurs (Public, {}).\n\n1. Marc (Confidentiel, {Exploitation}) lit Planning tournées (Interne, {Exploitation}).\n2. Léa (Interne, {Exploitation}) lit Tarifs clients (Confidentiel, {Exploitation}).\n3. Sonia (Confidentiel, {Finance}) lit Bilan (Confidentiel, {Finance}).\n4. Marc (Confidentiel, {Exploitation}) lit Bilan (Confidentiel, {Finance}).\n5. La directrice (Secret, {RH, Finance, Exploitation}) lit Tarifs clients (Confidentiel, {Exploitation}).\n6. Léa (Interne, {Exploitation}) lit Procédures chauffeurs (Public, {})."},"Q29":{"g":"G29","ctx":null,"final":false,"sl":103,"ap":104,"type":"single","txt":"Inès est habilitée (Secret, {RH, Finance}). Elle veut lire une procédure (Public, {}). Que décide le système ?","opts":["Refusé : la procédure n’a aucun compartiment, donc aucune habilitation ne correspond","Refusé : Inès possède plus de compartiments que la procédure n’en demande","Permis : le niveau suffit, et l’ensemble vide est inclus dans tout ensemble","Permis, mais seulement avec l’accord du propriétaire de la procédure"],"t":60,"rap":"Inès est habilitée (Secret, {RH, Finance}). Elle veut lire une procédure (Public, {}). Que décide le système ?\n\nA. Refusé : la procédure n’a aucun compartiment, donc aucune habilitation ne correspond\nB. Refusé : Inès possède plus de compartiments que la procédure n’en demande\nC. Permis : le niveau suffit, et l’ensemble vide est inclus dans tout ensemble\nD. Permis, mais seulement avec l’accord du propriétaire de la procédure"},"Q30":{"g":"G30","ctx":null,"final":false,"sl":108,"ap":109,"type":"single","txt":"Un composant intercepte chaque requête vers une application et interroge un serveur de politiques avant de laisser passer. Quel est son rôle dans l’architecture ABAC ?","opts":["PDP : il prend la décision","PEP : il applique la décision","PAP : il écrit les politiques","PIP : il fournit les attributs"],"t":60,"rap":"Un composant intercepte chaque requête vers une application et interroge un serveur de politiques avant de laisser passer. Quel est son rôle dans l’architecture ABAC ?\n\nA. PDP : il prend la décision\nB. PEP : il applique la décision\nC. PAP : il écrit les politiques\nD. PIP : il fournit les attributs"},"Q31":{"g":"G31","ctx":null,"final":false,"sl":110,"ap":111,"type":"multi","txt":"Politique : PERMIS de lire un dossier client si rôle = gestionnaire ET appareil = géré ET heure entre 7 h et 20 h ET classification ≤ Confidentiel. Sinon REFUSÉ. Requêtes : 1. Marc, gestionnaire, PC géré, 10 h, dossier Confidentiel. 2. Marc, gestionnaire, PC personnel, 10 h, dossier Confidentiel. 3. Marc, gestionnaire, PC géré, 23 h, dossier Confidentiel. 4. Karim, intérimaire, PC géré, 10 h, dossier Interne.","items":[{"t":"Requête 1 : Marc, gestionnaire, PC géré, 10 h, dossier Confidentiel.","o":["REFUSÉ : rôle","PERMIS","REFUSÉ : appareil","REFUSÉ : heure"]},{"t":"Requête 2 : Marc, gestionnaire, PC personnel, 10 h, dossier Confidentiel.","o":["PERMIS","REFUSÉ : rôle","REFUSÉ : heure","REFUSÉ : appareil"]},{"t":"Requête 3 : Marc, gestionnaire, PC géré, 23 h, dossier Confidentiel.","o":["PERMIS","REFUSÉ : heure","REFUSÉ : rôle","REFUSÉ : appareil"]},{"t":"Requête 4 : Karim, intérimaire, PC géré, 10 h, dossier Interne.","o":["PERMIS","REFUSÉ : appareil","REFUSÉ : heure","REFUSÉ : rôle"]},{"t":"Pourquoi cette politique est-elle difficile à exprimer en RBAC seul ?","o":["Le RBAC ne sait pas représenter les gestionnaires, seulement les administrateurs","Il faudrait moins de rôles que d’utilisateurs, ce que le RBAC interdit","L’appareil et l’heure sont des attributs de contexte, qu’un rôle ne porte pas","Le RBAC refuse toute condition liée à la classification des dossiers"]}],"opts":[],"t":210,"rap":"Politique : PERMIS de lire un dossier client si rôle = gestionnaire ET appareil = géré ET heure entre 7 h et 20 h ET classification ≤ Confidentiel. Sinon REFUSÉ. Requêtes : 1. Marc, gestionnaire, PC géré, 10 h, dossier Confidentiel. 2. Marc, gestionnaire, PC personnel, 10 h, dossier Confidentiel. 3. Marc, gestionnaire, PC géré, 23 h, dossier Confidentiel. 4. Karim, intérimaire, PC géré, 10 h, dossier Interne.\n\n1. Requête 1 : Marc, gestionnaire, PC géré, 10 h, dossier Confidentiel.\n2. Requête 2 : Marc, gestionnaire, PC personnel, 10 h, dossier Confidentiel.\n3. Requête 3 : Marc, gestionnaire, PC géré, 23 h, dossier Confidentiel.\n4. Requête 4 : Karim, intérimaire, PC géré, 10 h, dossier Interne.\n5. Pourquoi cette politique est-elle difficile à exprimer en RBAC seul ?"},"Q32":{"g":"G32","ctx":null,"final":false,"sl":114,"ap":115,"type":"single","txt":"Politique : PERMIS d’exporter un rapport si service = Qualité ET réseau = interne ET jour = ouvré. Hugo (service Qualité) demande l’export mardi depuis le Wi-Fi invité. Décision ?","opts":["Permis : il est dans le bon service un jour ouvré","Refusé : mardi n’est pas ouvré","Permis, car Hugo est connu de l’annuaire","Refusé : le réseau n’est pas interne"],"t":60,"rap":"Politique : PERMIS d’exporter un rapport si service = Qualité ET réseau = interne ET jour = ouvré. Hugo (service Qualité) demande l’export mardi depuis le Wi-Fi invité. Décision ?\n\nA. Permis : il est dans le bon service un jour ouvré\nB. Refusé : mardi n’est pas ouvré\nC. Permis, car Hugo est connu de l’annuaire\nD. Refusé : le réseau n’est pas interne"},"Q33":{"g":"G33","ctx":null,"final":false,"sl":116,"ap":117,"type":"single","txt":"Le même gestionnaire est accepté à 10 h mais refusé à 23 h pour le même dossier. Quelle famille d’attributs explique la différence ?","opts":["L’environnement (ici l’heure)","Le sujet (son rôle)","La ressource (sa classification)","L’action (lire ou modifier)"],"t":60,"rap":"Le même gestionnaire est accepté à 10 h mais refusé à 23 h pour le même dossier. Quelle famille d’attributs explique la différence ?\n\nA. L’environnement (ici l’heure)\nB. Le sujet (son rôle)\nC. La ressource (sa classification)\nD. L’action (lire ou modifier)"},"Q34":{"g":"G34","ctx":null,"final":false,"sl":118,"ap":119,"type":"multi","txt":"Règle métier de TransLor : « Les fiches de paie (Confidentiel) ne sont consultables que par un agent RH, depuis un poste géré, du lundi au vendredi de 8 h à 18 h, et seulement pour les salariés de son agence. »","items":[{"t":"Quel élément de la règle « fiches de paie » est un attribut d’ENVIRONNEMENT ?","o":["L’appareil = géré","Le service = RH","Le type = fiche de paie","L’agence du salarié concerné"]},{"t":"Quelle politique traduit correctement la règle ?","o":["PERMIS SI service = RH OU appareil = géré OU jour ouvré OU heure entre 8 h et 18 h","PERMIS SI service = RH ET appareil = géré ET type = fiche de paie, sans condition de jour ni d’heure","PERMIS SI service = RH ET type = fiche de paie ET même agence ET appareil = géré ET jour ouvré ET 8 h ≤ heure ≤ 18 h","PERMIS SI type = fiche de paie ET heure entre 8 h et 18 h ET jour ouvré"]},{"t":"(a) Paul, RH Nancy, poste géré, mardi 10 h, fiche d’un salarié de Nancy : décision ?","o":["REFUSÉ : agence différente","REFUSÉ : appareil non géré ou jour non ouvré","PERMIS","REFUSÉ : service non RH"]},{"t":"(b) Paul, RH Nancy, poste géré, mardi 10 h, fiche d’un salarié de Metz : décision ?","o":["PERMIS","REFUSÉ : appareil non géré ou jour non ouvré","REFUSÉ : service non RH","REFUSÉ : agence différente"]},{"t":"(c) Paul, RH Nancy, PC personnel, samedi 9 h, fiche d’un salarié de Nancy : décision ?","o":["PERMIS","REFUSÉ : agence différente","REFUSÉ : service non RH","REFUSÉ : appareil non géré ou jour non ouvré"]},{"t":"Quel attribut est le plus fragile ?","o":["Le jour de la semaine, lu sur le calendrier du serveur","Le type de document, inscrit dans le nom du fichier","« Appareil géré », qui dépend d’un inventaire à jour","L’heure du serveur, synchronisée sur une source officielle"]}],"opts":[],"t":240,"rap":"Règle métier de TransLor : « Les fiches de paie (Confidentiel) ne sont consultables que par un agent RH, depuis un poste géré, du lundi au vendredi de 8 h à 18 h, et seulement pour les salariés de son agence. »\n\n1. Quel élément de la règle « fiches de paie » est un attribut d’ENVIRONNEMENT ?\n2. Quelle politique traduit correctement la règle ?\n3. (a) Paul, RH Nancy, poste géré, mardi 10 h, fiche d’un salarié de Nancy : décision ?\n4. (b) Paul, RH Nancy, poste géré, mardi 10 h, fiche d’un salarié de Metz : décision ?\n5. (c) Paul, RH Nancy, PC personnel, samedi 9 h, fiche d’un salarié de Nancy : décision ?\n6. Quel attribut est le plus fragile ?"},"Q35":{"g":"G35","ctx":null,"final":false,"sl":120,"ap":121,"type":"single","txt":"Quel est le principal risque d’une politique ABAC reposant sur l’attribut « appareil géré » si l’inventaire des appareils est incomplet ?","opts":["Le PDP ne peut plus évaluer la politique et refuse toutes les demandes sans exception","La politique elle-même devient publique, ce qui expose les règles à un attaquant","Le PEP applique la décision à la place du PDP, ce qui rend la règle incohérente","Des accès légitimes bloqués ou des accès illégitimes acceptés, selon que l’inventaire oublie un appareil ou en déclare un à tort"],"t":60,"rap":"Quel est le principal risque d’une politique ABAC reposant sur l’attribut « appareil géré » si l’inventaire des appareils est incomplet ?\n\nA. Le PDP ne peut plus évaluer la politique et refuse toutes les demandes sans exception\nB. La politique elle-même devient publique, ce qui expose les règles à un attaquant\nC. Le PEP applique la décision à la place du PDP, ce qui rend la règle incohérente\nD. Des accès légitimes bloqués ou des accès illégitimes acceptés, selon que l’inventaire oublie un appareil ou en déclare un à tort"},"Q36":{"g":"G36","ctx":null,"final":false,"sl":125,"ap":126,"type":"single","txt":"Dans une politique OrBAC, « Gestionnaire » désigne…","opts":["Un rôle : l’abstraction d’un ensemble de sujets","Un sujet : une personne précise, comme Marc","Une vue : l’abstraction d’un ensemble d’objets, comme les tournées ou les factures","Un contexte : une condition de validité, comme « heures ouvrées »"],"t":60,"rap":"Dans une politique OrBAC, « Gestionnaire » désigne…\n\nA. Un rôle : l’abstraction d’un ensemble de sujets\nB. Un sujet : une personne précise, comme Marc\nC. Une vue : l’abstraction d’un ensemble d’objets, comme les tournées ou les factures\nD. Un contexte : une condition de validité, comme « heures ouvrées »"},"Q37":{"g":"G37","ctx":null,"final":false,"sl":127,"ap":128,"type":"single","txt":"Permission(Épinal, Magasinier, Consulter, Stocks, HorairesOuverts). Que représente « HorairesOuverts » ?","opts":["L’organisation, c’est-à-dire l’entité à laquelle la règle s’applique, ici une agence","Le contexte : la condition précise dans laquelle la permission est valable (ici, les horaires d’ouverture)","La vue, c’est-à-dire l’ensemble des objets concernés par la permission","L’activité, c’est-à-dire l’action que la règle autorise sur ces objets"],"t":60,"rap":"Permission(Épinal, Magasinier, Consulter, Stocks, HorairesOuverts). Que représente « HorairesOuverts » ?\n\nA. L’organisation, c’est-à-dire l’entité à laquelle la règle s’applique, ici une agence\nB. Le contexte : la condition précise dans laquelle la permission est valable (ici, les horaires d’ouverture)\nC. La vue, c’est-à-dire l’ensemble des objets concernés par la permission\nD. L’activité, c’est-à-dire l’action que la règle autorise sur ces objets"},"Q38":{"g":"G38","ctx":null,"final":false,"sl":129,"ap":130,"type":"multi","txt":"Règle 1 : à l’agence de Metz, un gestionnaire peut modifier une tournée pendant les heures ouvrées. Règle 2 : un comptable ne peut jamais modifier une tournée. Règle 3 : en cas d’urgence, le responsable d’exploitation doit être prévenu de toute modification de tournée. Une règle OrBAC s’écrit Type(Organisation, Rôle, Activité, Vue, Contexte).","items":[{"t":"Quelle formule traduit la règle 1 (gestionnaire de Metz, heures ouvrées) ?","o":["Obligation(Metz, Gestionnaire, Modifier, Tournées, HeuresOuvrées)","Permission(TransLor, Comptable, Modifier, Tournées, HeuresOuvrées)","Permission(Metz, Gestionnaire, Modifier, Tournées, HeuresOuvrées)","Interdiction(Metz, Gestionnaire, Modifier, Tournées, HeuresOuvrées)"]},{"t":"Quelle formule traduit la règle 2 (un comptable ne modifie jamais une tournée) ?","o":["Permission(TransLor, Comptable, Modifier, Tournées, Toujours)","Obligation(TransLor, Comptable, Modifier, Tournées, Toujours)","Interdiction(Metz, Gestionnaire, Modifier, Tournées, Toujours)","Interdiction(TransLor, Comptable, Modifier, Tournées, Toujours)"]},{"t":"Quelle formule traduit la règle 3 (en urgence, le responsable doit être prévenu) ?","o":["Obligation(TransLor, ResponsableExploitation, Être prévenu, Modifications de tournées, Urgence)","Permission(TransLor, ResponsableExploitation, Être prévenu, Modifications de tournées, Urgence)","Interdiction(TransLor, ResponsableExploitation, Modifier, Tournées, Urgence)","Obligation(TransLor, Gestionnaire, Modifier, Tournées, Toujours)"]},{"t":"Dans la règle 1, quel élément est le contexte ?","o":["HeuresOuvrées","Gestionnaire","Modifier","Tournées"]},{"t":"Marc, gestionnaire à Metz, veut modifier la tournée T-1042 à 22 h un mardi : décision ?","o":["PERMIS, car il est gestionnaire","REFUSÉ, car le contexte HeuresOuvrées est faux","PERMIS, car la tournée existe","REFUSÉ, car il est à Metz"]}],"opts":[],"t":210,"rap":"Règle 1 : à l’agence de Metz, un gestionnaire peut modifier une tournée pendant les heures ouvrées. Règle 2 : un comptable ne peut jamais modifier une tournée. Règle 3 : en cas d’urgence, le responsable d’exploitation doit être prévenu de toute modification de tournée. Une règle OrBAC s’écrit Type(Organisation, Rôle, Activité, Vue, Contexte).\n\n1. Quelle formule traduit la règle 1 (gestionnaire de Metz, heures ouvrées) ?\n2. Quelle formule traduit la règle 2 (un comptable ne modifie jamais une tournée) ?\n3. Quelle formule traduit la règle 3 (en urgence, le responsable doit être prévenu) ?\n4. Dans la règle 1, quel élément est le contexte ?\n5. Marc, gestionnaire à Metz, veut modifier la tournée T-1042 à 22 h un mardi : décision ?"},"Q39":{"g":"G39","ctx":null,"final":false,"sl":132,"ap":133,"type":"single","txt":"Quelle règle OrBAC ne peut pas s’exprimer dans un RBAC de base ?","opts":["« Un conducteur peut consulter une tournée, quelle que soit la situation et à toute heure »","« Marc, Nadia et Karim reçoivent le rôle Comptable pour la durée de leur mission »","« Le responsable doit être prévenu de toute modification en cas d’urgence »","« Le gestionnaire hérite des permissions du conducteur, y compris les nouvelles »"],"t":60,"rap":"Quelle règle OrBAC ne peut pas s’exprimer dans un RBAC de base ?\n\nA. « Un conducteur peut consulter une tournée, quelle que soit la situation et à toute heure »\nB. « Marc, Nadia et Karim reçoivent le rôle Comptable pour la durée de leur mission »\nC. « Le responsable doit être prévenu de toute modification en cas d’urgence »\nD. « Le gestionnaire hérite des permissions du conducteur, y compris les nouvelles »"},"Q40":{"g":"G40","ctx":null,"final":false,"sl":136,"ap":137,"type":"multi","txt":"TransLor doit protéger quatre besoins : A. Le partage du dossier « Exploitation » entre 15 gestionnaires. B. Les droits du TMS pour 120 salariés. C. L’accès aux fichiers de paie, uniquement depuis un poste géré, aux heures ouvrées. D. Un serveur d’archives juridiques dont les données ne doivent jamais fuiter vers un niveau inférieur.","items":[{"t":"Besoin A (partage Exploitation entre 15 gestionnaires) : quel modèle principal ?","o":["DAC encadré","RBAC","MAC Bell-LaPadula","ABAC"]},{"t":"Besoin B (droits du TMS pour 120 salariés) : quel modèle principal ?","o":["DAC","ABAC","MAC","RBAC"]},{"t":"Besoin C (fichiers de paie, poste géré, heures ouvrées) : quel modèle principal ?","o":["DAC","RBAC seul","ABAC","MAC Bell-LaPadula"]},{"t":"Besoin D (archives juridiques, aucune fuite vers un niveau inférieur) : quel modèle principal ?","o":["DAC","MAC avec Bell-LaPadula","RBAC","ABAC"]},{"t":"Quel est le risque résiduel du besoin C ?","o":["L’heure du serveur est trop précise pour être comparée à la plage horaire","Un appareil « géré » compromis ou mal inventorié ouvre l’accès","Le fichier de paie est trop volumineux pour être évalué à chaque accès","Les rôles de base sont trop nombreux pour être administrés"]}],"opts":[],"t":210,"rap":"TransLor doit protéger quatre besoins : A. Le partage du dossier « Exploitation » entre 15 gestionnaires. B. Les droits du TMS pour 120 salariés. C. L’accès aux fichiers de paie, uniquement depuis un poste géré, aux heures ouvrées. D. Un serveur d’archives juridiques dont les données ne doivent jamais fuiter vers un niveau inférieur.\n\n1. Besoin A (partage Exploitation entre 15 gestionnaires) : quel modèle principal ?\n2. Besoin B (droits du TMS pour 120 salariés) : quel modèle principal ?\n3. Besoin C (fichiers de paie, poste géré, heures ouvrées) : quel modèle principal ?\n4. Besoin D (archives juridiques, aucune fuite vers un niveau inférieur) : quel modèle principal ?\n5. Quel est le risque résiduel du besoin C ?"},"Q41":{"g":"G41","ctx":null,"final":false,"sl":138,"ap":139,"type":"single","txt":"Une clinique veut que seuls les médecins du service concerné consultent un dossier patient, et seulement quand ils sont de garde. Quel est le modèle le plus adapté ?","opts":["DAC pur, chacun partage ses dossiers","ABAC, avec les attributs service et garde","Biba, pour protéger l’intégrité","Aucun modèle, un mot de passe commun suffit"],"t":60,"rap":"Une clinique veut que seuls les médecins du service concerné consultent un dossier patient, et seulement quand ils sont de garde. Quel est le modèle le plus adapté ?\n\nA. DAC pur, chacun partage ses dossiers\nB. ABAC, avec les attributs service et garde\nC. Biba, pour protéger l’intégrité\nD. Aucun modèle, un mot de passe commun suffit"},"Q42":{"g":"G42","ctx":null,"final":false,"sl":141,"ap":142,"type":"multi","txt":"Matrice (R = lecture, W = écriture, X = exécution). Objets : Tarifs, Factures, Script. Marc : Tarifs R, Factures R, Script RX. Sonia : Tarifs R, Factures RW, Script aucun. Léa : Tarifs aucun, Factures aucun, Script X.","items":[{"t":"Matrice : Marc (Tarifs R, Factures R, Script RX), Sonia (Tarifs R, Factures RW, Script aucun), Léa (Tarifs aucun, Factures aucun, Script X). Quelle est l’ACL de l’objet Factures ?","o":["Marc : RW ; Sonia : R ; Léa : aucun droit","Marc : R ; Sonia : RW ; Léa : X","Marc : RX ; Sonia : RW ; Léa : aucun droit","Marc : R ; Sonia : RW ; Léa : aucun droit"]},{"t":"Quelle est la liste de capabilities de Marc ?","o":["Tarifs : R ; Factures : RW ; Script : RX","Tarifs : R ; Factures : R ; Script : X","Tarifs : aucun ; Factures : R ; Script : RX","Tarifs : R ; Factures : R ; Script : RX"]},{"t":"Quelle lecture est la plus pratique pour « qui peut modifier Factures ? » et pour « que peut faire Marc ? »","o":["Les capabilities pour la première, l’ACL pour la seconde","L’ACL pour les deux","L’ACL pour la première, les capabilities pour la seconde","Les capabilities pour les deux"]}],"opts":[],"t":150,"rap":"Matrice (R = lecture, W = écriture, X = exécution). Objets : Tarifs, Factures, Script. Marc : Tarifs R, Factures R, Script RX. Sonia : Tarifs R, Factures RW, Script aucun. Léa : Tarifs aucun, Factures aucun, Script X.\n\n1. Matrice : Marc (Tarifs R, Factures R, Script RX), Sonia (Tarifs R, Factures RW, Script aucun), Léa (Tarifs aucun, Factures aucun, Script X). Quelle est l’ACL de l’objet Factures ?\n2. Quelle est la liste de capabilities de Marc ?\n3. Quelle lecture est la plus pratique pour « qui peut modifier Factures ? » et pour « que peut faire Marc ? »"},"Q43":{"g":"G43","ctx":null,"final":false,"sl":144,"ap":145,"type":"single","txt":"Quel principe consiste à ne donner à chacun que les droits strictement nécessaires à sa mission ?","opts":["La séparation des tâches : deux personnes interviennent sur une opération sensible","La défense en profondeur : plusieurs protections se superposent","Le moindre privilège : limiter les droits de chaque compte au minimum nécessaire à sa mission","La non-répudiation : on ne peut pas nier avoir effectué une action"],"t":60,"rap":"Quel principe consiste à ne donner à chacun que les droits strictement nécessaires à sa mission ?\n\nA. La séparation des tâches : deux personnes interviennent sur une opération sensible\nB. La défense en profondeur : plusieurs protections se superposent\nC. Le moindre privilège : limiter les droits de chaque compte au minimum nécessaire à sa mission\nD. La non-répudiation : on ne peut pas nier avoir effectué une action"},"Q44":{"g":"G44","ctx":null,"final":false,"sl":146,"ap":147,"type":"multi","txt":"Retour sur la fraude au RIB de 18 400 € : Sonia créait un fournisseur, modifiait son RIB et validait le paiement. Le partage « Fournisseurs » était en DAC ; les droits du TMS étaient en RBAC mais avec un rôle Comptable trop large. La marge annuelle est d’environ 280 k€.","items":[{"t":"Qu’est-ce qui a failli côté DAC ?","o":["Le propriétaire du partage a élargi les droits sans contrôle","Le serveur était trop ancien","Le RIB était trop long","La règle d’héritage était absente"]},{"t":"Qu’est-ce qui a failli côté RBAC ?","o":["Le nombre de rôles était trop faible pour couvrir les 120 salariés","Aucun lien entre les utilisateurs et les rôles n’avait été défini dans le TMS","La hiérarchie des rôles était trop courte pour transmettre les droits","Le rôle Comptable cumulait gestion des fournisseurs et validation des paiements"]},{"t":"Quel correctif ABAC est le plus pertinent ?","o":["Bloquer tous les paiements du jour dès qu’un RIB a été modifié dans le mois","Ajouter un rôle « Comptable senior » qui valide à la place de Sonia","Refuser « valider un paiement » si le RIB a moins de 48 h et le montant dépasse un seuil, sauf double validation","Interdire toute ACL sur le partage Fournisseurs"]},{"t":"Quelle perte aurait été évitée ?","o":["280 000 €","18 400 €","6,6 % de 18 400 €","0 €"]},{"t":"Cette perte représente quel pourcentage de la marge annuelle (280 k€) ?","o":["6,6 %","66 %","0,66 %","15 %"]}],"opts":[],"t":210,"rap":"Retour sur la fraude au RIB de 18 400 € : Sonia créait un fournisseur, modifiait son RIB et validait le paiement. Le partage « Fournisseurs » était en DAC ; les droits du TMS étaient en RBAC mais avec un rôle Comptable trop large. La marge annuelle est d’environ 280 k€.\n\n1. Qu’est-ce qui a failli côté DAC ?\n2. Qu’est-ce qui a failli côté RBAC ?\n3. Quel correctif ABAC est le plus pertinent ?\n4. Quelle perte aurait été évitée ?\n5. Cette perte représente quel pourcentage de la marge annuelle (280 k€) ?"},"Q45":{"g":"G45","ctx":null,"final":false,"sl":149,"ap":150,"type":"multi","txt":"Événements à TransLor : (a) arrivée de Nadia, comptable ; (b) Léa, conductrice, devient gestionnaire ; (c) fin de mission de Karim, intérimaire. L’audit trouve 12 comptes d’anciens salariés encore actifs, en plus des 120 comptes de salariés.","items":[{"t":"Arrivée de Nadia (comptable) : quelle séquence est correcte ?","o":["Compte nominatif, rôle Comptable, validation du manager, activation, information de l’utilisatrice","Copier le compte de Sonia pour que Nadia ait exactement les mêmes accès dès le premier jour","Donner un accès administrateur « le temps de voir », à retirer plus tard","Créer un compte partagé avec le reste du service pour gagner du temps"]},{"t":"Mutation de Léa (conductrice → gestionnaire) : quelle séquence est correcte ?","o":["Ajouter Gestionnaire et garder Conducteur, au cas où Léa remplace un collègue","Créer un second compte pour le rôle Gestionnaire et conserver l’ancien","Retirer Conducteur, ajouter Gestionnaire, faire valider et journaliser","Ne rien changer avant la revue annuelle des droits, pour éviter les erreurs"]},{"t":"Départ de Karim (intérimaire) : quelle séquence est correcte ?","o":["Attendre la fin du mois pour traiter ensemble tous les départs","Désactiver le compte le dernier jour, récupérer le matériel, retirer les rôles, archiver puis supprimer","Changer son mot de passe, ce qui suffit à empêcher toute connexion","Supprimer immédiatement toutes ses données, y compris celles à conserver"]},{"t":"Quelle part des comptes actifs (120 + 12 = 132) est orpheline ?","o":["10 %","9,1 %","12 %","0,1 %"]},{"t":"Quel indicateur de suivi mensuel est le plus pertinent ?","o":["Nombre de connexions enregistrées par le serveur d’annuaire chaque mois","Nombre de rôles créés dans le TMS depuis le début de l’année","Nombre de courriels de sensibilisation envoyés aux utilisateurs","Comptes actifs d’anciens salariés au dernier jour du mois (cible 0)"]}],"opts":[],"t":210,"rap":"Événements à TransLor : (a) arrivée de Nadia, comptable ; (b) Léa, conductrice, devient gestionnaire ; (c) fin de mission de Karim, intérimaire. L’audit trouve 12 comptes d’anciens salariés encore actifs, en plus des 120 comptes de salariés.\n\n1. Arrivée de Nadia (comptable) : quelle séquence est correcte ?\n2. Mutation de Léa (conductrice → gestionnaire) : quelle séquence est correcte ?\n3. Départ de Karim (intérimaire) : quelle séquence est correcte ?\n4. Quelle part des comptes actifs (120 + 12 = 132) est orpheline ?\n5. Quel indicateur de suivi mensuel est le plus pertinent ?"},"Q46":{"g":"G46","ctx":null,"final":false,"sl":151,"ap":152,"type":"single","txt":"Le jour du départ d’un salarié, quelle est la première action sur ses droits d’accès ?","opts":["Attendre la fin du mois pour grouper les départs","Donner ses droits à un collègue","Changer son mot de passe et le garder actif","Désactiver son compte"],"t":60,"rap":"Le jour du départ d’un salarié, quelle est la première action sur ses droits d’accès ?\n\nA. Attendre la fin du mois pour grouper les départs\nB. Donner ses droits à un collègue\nC. Changer son mot de passe et le garder actif\nD. Désactiver son compte"},"Q47":{"g":"G47","ctx":null,"final":false,"sl":154,"ap":155,"type":"multi","txt":"Extrait de l’audit TransLor : 1. Karim (intérimaire, parti il y a 2 mois) : compte actif, rôle Conducteur. 2. Sonia : rôles Comptable et Responsable d’exploitation. 3. Compte « admin_tms » partagé par 3 informaticiens, mot de passe commun. 4. Dossier « RH » : groupe « Tout le monde » en lecture. 5. Marc, gestionnaire : accès aux tarifs, nécessaire à son travail.","items":[{"t":"Ligne 1 (Karim, parti il y a 2 mois, compte actif, rôle Conducteur) : verdict ?","o":["Conforme : l’intérim a un rôle Conducteur adapté à sa mission passée","Anomalie : compte orphelin, cycle de vie non respecté","Anomalie : compte partagé entre plusieurs personnes","Anomalie : accès trop large pour un conducteur"]},{"t":"Ligne 2 (Sonia : rôles Comptable et Responsable d’exploitation) : verdict ?","o":["Conforme : Sonia est de confiance et connaît les deux métiers","Anomalie : compte orphelin laissé après un changement de poste","Anomalie : cumul de rôles incompatibles (séparation des tâches)","Anomalie : héritage de rôle mal configuré"]},{"t":"Ligne 3 (admin_tms partagé par 3 informaticiens, mot de passe commun) : verdict ?","o":["Conforme : le mot de passe est connu des seuls informaticiens","Anomalie : compte partagé, perte d’imputabilité","Anomalie : cumul de rôles incompatibles sur un même compte","Anomalie : compte orphelin depuis plus de deux mois"]},{"t":"Ligne 4 (dossier « RH » lisible par « Tout le monde ») : verdict ?","o":["Anomalie : données RH sur-exposées, à restreindre au rôle RH","Conforme : le groupe « Tout le monde » est en lecture seule","Anomalie : compte orphelin ayant accès au dossier","Anomalie : dossier géré par un compte partagé"]},{"t":"Ligne 5 (Marc, gestionnaire, accède aux tarifs, nécessaire à son travail) : verdict ?","o":["Anomalie : un gestionnaire n’a pas à lire les tarifs","Anomalie : le compte de Marc est partagé avec la direction","Conforme : accès justifié par la fonction","Anomalie : compte orphelin depuis le dernier audit"]}],"opts":[],"t":210,"rap":"Extrait de l’audit T   const rv = c.st === 'rev' && pub.rev, cl = c.cl || [], mx = Math.max(1, ...cl.map(x => x[1]));
  let h = `<div style="display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:center;min-height:260px;padding:10px">` + (cl.length ? cl.map(x => {
    const fs = Math.round(22 + 38 * x[1] / mx), good = rv && x[2];
    return `<span style="font-size:${fs}px;line-height:1.1;padding:2px 10px;border-radius:10px;border:${good ? '3px solid #56B4E9' : rv ? '2px dashed #FF8A3D' : '2px solid #1F3556'};font-weight:${good ? 800 : 600}">${good ? '✓ ' : ''}${AC.esc(x[0])} <small style="font-size:.55em;opacity:.85">×${x[1]}</small></span>`;
  }).join('') : `<span class="muted" style="font-size:26px">Les mots apparaîtront ici dès que les étudiants les saisissent…</span>`) + `</div>`;
  if (c.st !== 'rev') h += flag(c) + `<p style="font-size:24px"><b>${c.done.length}</b> / ${pub.np} étudiants ont répondu</p>`;
  else if (rv) h += `<div style="margin-top:8px">${(pub.rev.ex || []).map(e => `<div style="font-size:22px;margin:3px 0"><b>${e[2] ? '✓' : '—'} ${AC.esc(e[0])}</b> : ${AC.esc(e[1])} <span class="muted">(${e[2]})</span></div>`).join('')}</div><p style="font-size:20px;margin:8px 0 0">${AC.esc(pub.rev.exp)}</p>`;
  return h;
}
function left() {
  if (!pub) return `<div class="card"><h1>Connexion…</h1></div>`;
  if (pub.end) return `<div class="card" style="text-align:center"><h1 style="font-size:46px">Séance terminée</h1><p style="font-size:26px">Merci à tous ${AC.PORTS(12)}</p></div>`;
  const c = pub.cur;
  if (!c) return `<div class="card" style="text-align:center"><h1 style="font-size:40px">Rejoignez la séance</h1><p style="font-size:24px;margin:.3em 0">Sur votre <b>PC</b>, ouvrez cette adresse :</p>
    <p class="mono" style="font-size:26px;color:#29D3FF;word-break:break-all"><b>${AC.esc(joinUrl())}</b></p><p style="font-size:22px">Choisissez un avatar, saisissez votre pseudo.</p>
    <div style="width:170px;margin:10px auto 0;background:#fff;padding:6px;border-radius:10px">${qrSvg(joinUrl(), 158)}</div><p class="muted" style="font-size:18px;margin:4px 0">▲ secours téléphone (le PC d’abord)</p><p style="font-size:30px"><b>${pub.np}</b> connecté${pub.np > 1 ? 's' : ''}</p></div>`;
  const q = AC.q(c.qid);
  let h = `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><span class="tag" style="font-size:26px"><b>Question ${AC.num(c.qid)}</b> · ${AC.esc(c.gt)}</span><span class="tag" style="font-size:18px">page ${c.sl} / ${c.tot}</span>${c.fin ? '<span class="pill test" style="font-size:20px">POINTS ×2</span>' : ''}
   ${c.st === 'open' ? `<b class="mono" id="tmr" style="font-size:54px">${c.rem >= 0 ? AC.fmtT(c.rem) : '+' + AC.fmtT(-c.rem) + ' · demi-points'}</b>` : `<span class="tag" style="font-size:18px">${c.st === 'closed' ? 'CLOSE' : 'CORRIGÉE'}</span>`}</div>
   <p style="font-size:30px;margin:.5em 0"><b>${AC.esc(q.txt)}</b></p>${q.ctx ? `<pre class="ctx" style="font-size:19px">${AC.esc(q.ctx)}</pre>` : ''}`;
  if (q.type === 'cloud') return h + cloudScreen(c, q) + '</div>';
  if (q.type === 'multi') {
    const rv = c.st === 'rev' && pub.rev;
    h += q.items.map((it, ii) => `<div style="margin:8px 0"><b style="font-size:22px">${ii + 1}. ${AC.esc(it.t)}</b>${it.o.map((o, i) => { const g = rv && i === pub.rev.rep[ii], tot = rv ? Math.max(1, ...pub.rev.cnt[ii]) : 1; return `<div class="opt ${rv ? (g ? 'good' : 'dim') : ''}" style="--oc:${AC.LCOL[i]};font-size:19px;cursor:default;padding:4px 10px;margin:3px 0"><span class="lt">${AC.LET[i]}</span><span style="flex:1">${AC.esc(o)} ${g ? '<b>✔</b>' : ''}</span>${rv ? `<span class="bar" style="width:${Math.round(110 * pub.rev.cnt[ii][i] / tot)}px;background:${AC.LCOL[i]}"></span><b class="mono">${pub.rev.cnt[ii][i]}</b>` : ''}</div>`; }).join('')}</div>`).join('');
    if (c.st !== 'rev') h += flag(c) + `<p style="font-size:24px"><b>${c.done.length}</b> / ${pub.np} réponses reçues</p>`;
    return h + '</div>';
  }
  const rev = c.st === 'rev' && pub.rev, mx = rev ? Math.max(1, ...pub.rev.cnt) : 1;
  h += q.opts.map((o, i) => `<div class="opt ${rev && pub.rev.rep >= 0 ? (i === pub.rev.rep ? 'good' : 'dim') : ''}" style="--oc:${AC.LCOL[i]};font-size:24px;cursor:default"><span class="lt">${AC.LET[i]}</span><span style="flex:1">${AC.esc(o)}</span>${rev ? `<span class="bar" style="width:${Math.round(160 * pub.rev.cnt[i] / mx)}px;background:${AC.LCOL[i]}"></span><b class="mono">${pub.rev.cnt[i]}</b>` : ''}</div>`).join('');
  if (c.st !== 'rev') h += flag(c) + `<p style="font-size:24px"><b>${c.done.length}</b> / ${pub.np} réponses reçues</p>`;
  else h += `<p style="font-size:20px;margin:8px 0 0">${AC.esc(pub.rev.exp)}</p>`;
  return h + '</div>';
}
function render() { $('root').innerHTML = `<div class="wrap" style="display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;padding:20px 26px"><div>${left()}</div><div>${board()}${pub && pub.test ? '<span class="pill test">MODE TEST</span>' : ''}</div></div><div class="foot">${AC.FOOT}</div>`; }
render();
</script></body></html>
